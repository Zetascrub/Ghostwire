name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - name: Host unit tests
        run: pio test -e native
      - name: Firmware build
        run: pio run -e cardputer_adv
      - name: Package artifacts
        run: |
          mkdir -p dist
          cp .pio/build/cardputer_adv/firmware.bin dist/ghostwire-firmware.bin
          cp .pio/build/cardputer_adv/bootloader.bin dist/ghostwire-bootloader.bin
          cp .pio/build/cardputer_adv/partitions.bin dist/ghostwire-partitions.bin
          git rev-parse HEAD > dist/GIT_COMMIT
          pio pkg list -e cardputer_adv > dist/DEPENDENCIES.txt
          sha256sum dist/*.bin > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ghostwire-${{ github.sha }}
          path: dist/
          if-no-files-found: error
